openapi: 3.0.3
info:
  title: Octer Auth API
  version: 1.0.0
  description: |
    ## OcterAPIで使用できる機能一覧
    1. ユーザー認証
    2. OAuthを用いたGoogleアカウントでの認証(OAuthで初めて認証を行った際にOcterの専用アカウントを自動作成)
    3. イベント情報のCRUD処理(一覧取得は日/週/月ごとに可能)
    4. チーム情報のCRUD処理(チーム内のプロジェクト情報の詳細情報の有無が選択可能)
    5. プロジェクト情報のCRUD処理(プロジェクト内のタスク情報の詳細情報の有無が選択可能)
    6. タスク情報のCRUD処理

servers:
  - url: https://api.octer
security:
  - OAuth2: [openid, email, profile]
paths:
  /api/auth/login:
    post:
      summary: アプリケーションユーザーによるログイン
      description: |
        Octerの専用ユーザーによるログイン用エンドポイント  
        https://api.octer/octer/api/auth/login
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginForm'
      responses:
        '204':
          description: ログイン成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Login success
        '401':
          description: 認証失敗
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid credentials

  /oauth2/authorization/google:
    get:
      summary: GoogleアカウントでOAuth2ログインを開始
      description: |
        Googleアカウントによるログイン用エンドポイント  
        https://api.octer/octer/oauth2/authorization/google
      operationId: OAUth2Login
      responses:
        '302':
          description: Googleログイン画面へリダイレクト
        '500':
          description: サーバー内部エラー

  /api/auth/logout:
    post:
      summary: ログアウト処理（セッション削除）
      description: |
        ログアウトによるセッション削除用エンドポイント  
        https://api.octer/octer/api/auth/logout
      operationId: logout
      responses:
        '204':
          description: ログアウト成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out

  /api/auth/get:
    get:
      summary: ログイン中のユーザー情報を取得（セッションより）
      description: |
        セッションのユーザー情報取得用エンドポイント  
        https://api.octer/octer/api/auth/get
      operationId: getUser
      responses:
        '200':
          description: ログインユーザー情報
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: 未認証状態
  
  /api/users/register:
    post:
      summary: アプリケーションユーザー登録
      description: |
        Octerの専用ユーザー登録用エンドポイント  
        https://api.octer/octer/api/users/register
      operationId: registerUser
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserForm'
      responses:
        '201':
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: 登録失敗

  /api/events/date/list/{date}:
    post:
      summary: イベント情報一覧取得
      description: |
        日付け指定のイベント情報取得用エンドポイント(yyyy-mm-dd)  
        https://api.octer/octer/api/events/date/list/{date}
      operationId: getDateEventList
      security:
        - OAuth2: [openid, email, profile]
      parameters:
        - name: date
          in: path
          required: true
          schema:
            type: string
            format: date
      responses:
        "200":
          description: イベント一覧取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: イベント一覧の取得に成功しました。
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        "401":
          description: 未認証状態
          
  /api/events/week/list/{week}:
    post:
      summary: イベント情報一覧取得
      description: |
        週指定のイベント情報取得用エンドポイント(yyyy-w○○)  
        https://api.octer/octer/api/events/date/list/{date}
      operationId: getWeekEventList
      security:
        - OAuth2: [openid, email, profile]
      parameters:
        - name: week
          in: path
          required: true
          schema:
            type: string
            
      responses:
        "200":
          description: イベント一覧取得成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: イベント一覧の取得に成功しました。
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
        "401":
          description: 未認証状態
          
  /api/events/month/list/{month}:
    post:
      summary: イベント情報一覧取得
      description: |
