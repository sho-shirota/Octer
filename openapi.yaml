components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://accounts.google.com/o/oauth2/v2/auth
          tokenUrl: https://oauth2.googleapis.com/token
          scopes:
            openid: OpenID Connect scope
            email: Access to your email
            profile: Access to your basic profile

  schemas:
    LoginForm:
      type: object
      x-imports:
        - com.octer.backend.validation.annotation.ValidEmail
        - com.octer.backend.validation.annotation.ValidPassword
      required: [email, password]
      properties:
        email:
          description: "取得したメールアドレス"
          type: string
          x-field-extra-annotation: "@ValidEmail"
          example: user@example.com
        password:
          description: "取得したパスワード"
          type: string
          format: password
          x-field-extra-annotation: "@ValidPassword"
          example: secret123
          
    UserForm:
      type: object
      x-imports:
        - com.octer.backend.validation.annotation.ValidEmail
        - com.octer.backend.validation.annotation.ValidPassword
      required: [name,email, password]
      properties:
        name:
          description: "取得したユーザー名"
          type: string
          x-field-extra-annotation: "@ValidName"
          example: user
        email:
          description: "取得したメールアドレス"
          type: string
          x-field-extra-annotation: "@ValidEmail"
          example: user@example.com
        password:
          description: "取得したパスワード"
          type: string
          format: password
          x-field-extra-annotation: "@ValidPassword"
          example: secret123
        profilePicture:
          description: "取得した画像データ"
          type: string
          format: binary
          
    LocationForm:
      type: object
      required: [latitude,longitude]
      properties:
        latitude:
          description: "取得した緯度"
          type: number
          format: double
        longitude:
          description: "取得した経度"
          type: number
          format: double
          
    EventForm:
      type: object
      required: [title,startDate,endDate]
      properties:
        title:
          description: "取得したイベントタイトル"
          type: string
        description:
